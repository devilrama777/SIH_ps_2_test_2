[package]
name = "cil-report-desktop"
version = "0.1.0"
description = "Tauri 2 Desktop shell for CIL Local AI Report Generator"
authors = ["CIL Report AI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-opener = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
